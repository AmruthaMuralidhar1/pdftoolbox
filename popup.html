<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PDF Forge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Home Screen -->
  <div id="home" class="screen active">
    <header>
      <span class="logo">🔨</span>
      <h1>PDF Forge</h1>
    </header>
    <div class="tools-grid">
      <button class="tool-btn" data-tool="merge">📎 Merge PDFs</button>
      <button class="tool-btn" data-tool="split">✂️ Split PDF</button>
      <button class="tool-btn" data-tool="extract">📄 Extract Pages</button>
      <button class="tool-btn" data-tool="reorder">🔄 Reorder Pages</button>
      <button class="tool-btn" data-tool="rotate">↻ Rotate Pages</button>
      <button class="tool-btn" data-tool="compress">🗜️ Compress PDF</button>
      <button class="tool-btn" data-tool="pdf2img">🖼️ PDF → Images</button>
      <button class="tool-btn" data-tool="img2pdf">📑 Images → PDF</button>
      <button class="tool-btn" data-tool="metadata">🧹 Clean Metadata</button>
      <button class="tool-btn" data-tool="watermark">💧 Watermark</button>
    </div>
    <footer>All processing is local — no uploads, no tracking</footer>
  </div>

  <!-- Tool Screen -->
  <div id="tool-screen" class="screen">
    <header>
      <button id="back-btn">← Back</button>
      <h1 id="tool-title"></h1>
    </header>
    <div id="tool-content"></div>
  </div>

  <!-- pdf-lib for PDF creation/manipulation -->
  <!-- Download from: https://unpkg.com/pdf-lib/dist/pdf-lib.min.js -->
  <script src="lib/pdf-lib.min.js"></script>
  <!-- PDF.js for rendering PDF pages to images (optional — only needed for PDF→Images) -->
  <!-- Download from: https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -->
  <script src="lib/pdf.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
